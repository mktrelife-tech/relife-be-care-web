<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บทความ — RELIFE BE CARE</title>
<meta name="description" content="บทความความรู้สุขภาพจาก RELIFE BE CARE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/img/logo-mark.png">
<link rel="stylesheet" href="assets/css/style.css?v=2">
</head>
<body>
<div id="site-header"></div>
<div class="wrap crumb"><a href="index.html">หน้าแรก</a> / <a href="articles.html">บทความ</a></div>

<article class="section section--tight">
  <div class="wrap" style="max-width:760px">
    <div id="post"></div>
    <div style="border-top:1px solid var(--sand);margin-top:40px;padding-top:24px">
      <p style="font-size:.85rem;color:var(--ink-faint)">
        บทความนี้มีวัตถุประสงค์เพื่อให้ความรู้ทั่วไปเท่านั้น ไม่ใช่คำแนะนำทางการแพทย์
        หากมีข้อสงสัยเกี่ยวกับสุขภาพ ควรปรึกษาแพทย์หรือเภสัชกร
      </p>
    </div>
  </div>
</article>

<section class="section section--sand">
  <div class="wrap">
    <div class="sec-head"><h2>บทความอื่น</h2></div>
    <div class="articles" id="more"></div>
  </div>
</section>

<div id="site-footer"></div>
<script src="assets/js/app.js?v=3"></script>
<script>
document.addEventListener("site:ready", function (e) {
  var S = e.detail, A = window.App;
  var slug = new URLSearchParams(location.search).get("slug");
  var a = S.articles.filter(function (x) { return x.slug === slug; })[0] || S.articles[0];
  if (!a) { A.$("#post").innerHTML = "<p>ไม่พบบทความ</p>"; return; }

  document.title = a.title + " — " + S.site.brand.name;
  var md = document.querySelector('meta[name="description"]');
  if (md) md.setAttribute("content", a.excerpt);

  /* แปลง Markdown แบบง่าย (หัวข้อ / ตัวหนา / รายการ / ย่อหน้า) */
  function mdToHtml(src) {
    return String(src || "").split(/\n{2,}/).map(function (blk) {
      blk = A.esc(blk.trim());
      if (!blk) return "";
      if (/^### /.test(blk)) return "<h3>" + blk.replace(/^### /, "") + "</h3>";
      if (/^## /.test(blk))  return "<h2>" + blk.replace(/^## /, "") + "</h2>";
      if (/^[-*] /m.test(blk)) {
        return "<ul>" + blk.split("\n").map(function (l) {
          return "<li>" + l.replace(/^[-*]\s*/, "") + "</li>";
        }).join("") + "</ul>";
      }
      return "<p>" + blk.replace(/\n/g, "<br>") + "</p>";
    }).join("")
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a class="art-link" href="$2">$1</a>');
  }

  /* กล่องสินค้าที่เกี่ยวข้อง (โยงบทความ → หน้าสินค้า) พร้อมรูปกล่องสินค้า */
  var relateHtml = "";
  if (a.product) {
    var rp = (S.products || []).filter(function (x) { return x.slug === a.product; })[0];
    var rName = rp ? rp.name : a.product;
    var rImg = a.productImage || (rp && rp.images && rp.images[0]) || "";
    var rUrl = A.url("p/" + A.esc(a.product) + ".html");
    relateHtml = '<a class="art-cta" href="' + rUrl + '">' +
      (rImg ? '<img class="art-cta__img" src="' + A.esc(rImg) + '" alt="' + A.esc(rName) + '" loading="lazy">' : "") +
      '<span class="art-cta__body">' +
        (a.productNote ? '<span class="art-cta__note">' + A.esc(a.productNote) + "</span>" : "") +
        '<span class="art-link">ดู ' + A.esc(rName) + " →</span>" +
      "</span></a>";
  }

  /* CTA ปรึกษาก่อนซื้อ + แอดไลน์ (แสดงท้ายทุกบทความ) */
  var ct = S.site.contact || {};
  var lineUrl = ct.lineUrl || (ct.lineId ? "https://line.me/R/ti/p/" + ct.lineId : "#");
  var consultHtml = '<div class="art-consult">' +
    '<div class="art-consult__txt"><strong>ยังไม่แน่ใจว่าเลือกตัวไหนดี?</strong>' +
    "<span>ทักมาถามทีมงานก่อนซื้อได้เลย ฟรี ไม่ต้องซื้อก็ปรึกษาได้</span></div>" +
    '<a class="btn-line" href="' + A.esc(lineUrl) + '" target="_blank" rel="noopener">' +
    '<span class="btn-line__ico">LINE</span> แอดไลน์ปรึกษา</a></div>';

  A.$("#post").innerHTML =
    "<span class='eyebrow'>" + A.esc(a.category) + "</span>" +
    "<h1 style='font-size:clamp(1.7rem,3.8vw,2.5rem)'>" + A.esc(a.title) + "</h1>" +
    "<p style='color:var(--ink-faint);font-size:.88rem'>เผยแพร่ " + A.esc(a.date) + "</p>" +
    (a.cover ? '<img src="' + A.esc(a.cover) + '" alt="" style="border-radius:var(--r-lg);margin:22px 0">'
             : '<div class="ph" style="aspect-ratio:16/9;margin:22px 0" data-label="ภาพปกบทความ 1200×675px"></div>') +
    "<p style='font-size:1.08rem;color:var(--ink-soft)'>" + A.esc(a.excerpt) + "</p>" +
    "<div style='font-size:1.02rem'>" + mdToHtml(a.body) + "</div>" + relateHtml + consultHtml;

  A.$("#more").innerHTML = S.articles.filter(function (x) { return x.slug !== a.slug; }).slice(0, 3).map(function (x) {
    return '<a class="article-card" href="article.html?slug=' + encodeURIComponent(x.slug) + '">' +
      '<div class="article-card__media">' + (x.cover
        ? '<img src="' + A.esc(x.cover) + '" alt="" loading="lazy">'
        : '<div class="ph" style="height:100%" data-label="ภาพประกอบ"></div>') + "</div>" +
      '<div class="article-card__body"><span class="article-card__cat">' + A.esc(x.category) + "</span>" +
      "<h3>" + A.esc(x.title) + "</h3></div></a>";
  }).join("");
});
</script>
</body>
</html>
