<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บทความสุขภาพ — RELIFE BE CARE</title>
<meta name="description" content="ความรู้เรื่องอาหารเสริม การอ่านฉลาก และการดูแลสุขภาพผู้สูงอายุ เขียนแบบเข้าใจง่าย ไม่ขายของ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/img/logo-mark.png">
<link rel="stylesheet" href="assets/css/style.css?v=2">
</head>
<body>
<div id="site-header"></div>
<div class="wrap crumb"><a href="index.html">หน้าแรก</a> / บทความ</div>

<section class="section section--tight">
  <div class="wrap">
    <div class="sec-head">
      <span class="eyebrow">อ่านก่อนซื้อ</span>
      <h1 style="font-size:clamp(1.8rem,4vw,2.6rem)">ความรู้ที่ช่วยให้คุณเลือกเป็น</h1>
      <p>เราเชื่อว่าคนที่เข้าใจสิ่งที่ตัวเองกิน จะดูแลตัวเองได้ดีกว่า</p>
    </div>
    <div class="articles" id="list"></div>
  </div>
</section>

<div id="site-footer"></div>
<script src="assets/js/app.js?v=2"></script>
<script>
document.addEventListener("site:ready", function (e) {
  var S = e.detail, A = window.App;
  A.$("#list").innerHTML = S.articles.map(function (a) {
    return '<a class="article-card reveal" href="article.html?slug=' + encodeURIComponent(a.slug) + '">' +
      '<div class="article-card__media">' + (a.cover
        ? '<img src="' + A.esc(a.cover) + '" alt="">'
        : '<div class="ph" style="height:100%" data-label="ภาพประกอบบทความ 1200×750px"></div>') + "</div>" +
      '<div class="article-card__body"><span class="article-card__cat">' + A.esc(a.category) + "</span>" +
      "<h3>" + A.esc(a.title) + "</h3><p>" + A.esc(a.excerpt) + "</p>" +
      "<p style='font-size:.8rem;color:var(--ink-faint);margin-top:10px'>" + A.esc(a.date) + "</p></div></a>";
  }).join("");
  A.initReveal();
});
</script>
</body>
</html>
