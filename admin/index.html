<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>หลังบ้าน — จัดการเนื้อหาเว็บไซต์</title>
</head>
<body>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="https://unpkg.com/decap-cms@^3.1.0/dist/decap-cms.js"></script>
<script>
  // กลับไปหน้าหลังบ้านอัตโนมัติหลังยืนยันอีเมลเชิญ
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", function (user) {
      if (!user) {
        window.netlifyIdentity.on("login", function () { document.location.href = "/admin/"; });
      }
    });
  }
</script>
</body>
</html>
