<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เลือกสินค้าตามเป้าหมายสุขภาพ — RELIFE BE CARE</title>
<meta name="description" content="เลือกผลิตภัณฑ์เสริมอาหารตามเป้าหมายสุขภาพที่คุณอยากดูแล — ไขมัน หัวใจ ไต ตับ กระดูก สมอง ภูมิคุ้มกัน ลำไส้ ผิวพรรณ เจอตัวที่ใช่ทันที">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/img/logo-mark.png">
<link rel="stylesheet" href="assets/css/style.css?v=7">
<style>
  /* ตัวเลือกเป้าหมาย (chips) */
  .goal-chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 26px; }
  .goal-chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--white); border: 1px solid var(--line, #e2e8df); border-radius: var(--r-pill);
    padding: 9px 16px; font-size: .95rem; font-weight: 600; color: var(--ink);
    box-shadow: var(--sh-sm); transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .goal-chip:hover { transform: translateY(-2px); box-shadow: var(--sh-md); border-color: var(--brand); color: var(--brand-dark); }
  .goal-chip__ico { font-size: 1.15rem; }
  /* หัวกลุ่ม */
  .goal-group { scroll-margin-top: 90px; margin-top: clamp(38px, 5vw, 58px); }
  .goal-group:first-of-type { margin-top: 8px; }
  .goal-head { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 2px solid var(--sand, #eef1ea); }
  .goal-head__ico {
    flex: 0 0 auto; width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center;
    font-size: 1.8rem; background: linear-gradient(135deg, var(--brand-wash), var(--sage-wash, #eaf1ec));
    box-shadow: inset 0 0 0 1px rgba(47,110,79,.12);
  }
  .goal-head__tx h2 { margin: 0; font-size: clamp(1.25rem, 3.2vw, 1.6rem); }
  .goal-head__tx p { margin: 3px 0 0; color: var(--ink-soft); font-size: .95rem; }
  .goal-count { margin-left: auto; align-self: center; font-size: .82rem; color: var(--ink-faint); white-space: nowrap; }
  @media (max-width: 520px) { .goal-count { display: none; } }
</style>
</head>
<body>
<div id="site-header"></div>
<div class="wrap crumb"><a href="index.html">หน้าแรก</a> / เลือกตามเป้าหมายสุขภาพ</div>

<section class="section section--tight">
  <div class="wrap">
    <div class="sec-head">
      <span class="eyebrow">เลือกง่ายใน 1 คลิก</span>
      <h1 style="font-size:clamp(1.8rem,4vw,2.6rem)">อยากดูแลเรื่องไหน เราจัดให้</h1>
      <p>เลือกเป้าหมายสุขภาพที่คุณสนใจ แล้วเจอผลิตภัณฑ์ที่ตรงกับคุณที่สุด — ไม่ต้องไล่ดูทีละตัว</p>
    </div>
    <div class="goal-chips" id="chips"></div>
  </div>
</section>

<section class="section section--tight">
  <div class="wrap" id="groups"></div>
</section>

<section class="section section--sage">
  <div class="wrap center">
    <h2>ยังเลือกไม่ถูก?</h2>
    <p style="color:var(--ink-soft);margin-bottom:24px">ทักมาเล่าอาการหรือเป้าหมายของคุณ ทีมงานช่วยแนะนำตัวที่เหมาะที่สุดให้ฟรี</p>
    <a class="btn btn--line btn--lg" id="consult" target="_blank" rel="noopener">ปรึกษาฟรีทาง LINE</a>
  </div>
</section>

<div id="site-footer"></div>
<script src="assets/js/app.js?v=4"></script>
<script>
document.addEventListener("site:ready", function (e) {
  var S = e.detail, A = window.App, P = S.products;

  /* จัดกลุ่มสินค้าตามเป้าหมายสุขภาพ */
  var GROUPS = [
    { id: "lipid",     ico: "❤️", name: "ไขมัน & หัวใจ",          desc: "ดูแลสมดุลไขมันในเลือดและหลอดเลือด",        slugs: ["beta-oil"] },
    { id: "kidney",    ico: "🫘", name: "บำรุงไต",                desc: "ดูแลและบำรุงการทำงานของไต",               slugs: ["beta-life"] },
    { id: "liver",     ico: "🫀", name: "บำรุงตับ",               desc: "ดูแลตับให้ทำงานได้เต็มที่",                slugs: ["beta-liv-pro-plus"] },
    { id: "bone",      ico: "🦴", name: "กระดูก & ข้อ",           desc: "เสริมแคลเซียมและคอลลาเจนดูแลข้อ",         slugs: ["beta-cal-pro-plus"] },
    { id: "brain",     ico: "🧠", name: "สมอง & ความจำ",          desc: "ดูแลความจำ สมาธิ และการทำงานของสมอง",     slugs: ["memora"] },
    { id: "immune",    ico: "🛡️", name: "ภูมิคุ้มกัน",            desc: "สนับสนุนระบบภูมิคุ้มกันให้แข็งแรง",        slugs: ["lab-farm", "betax-plus"] },
    { id: "gut",       ico: "🌱", name: "ลำไส้ & การย่อย",        desc: "ดูแลระบบทางเดินอาหารและลำไส้",            slugs: ["beta-care"] },
    { id: "whole",     ico: "🌿", name: "ดูแลองค์รวม & สมุนไพร",  desc: "สมุนไพรและสารสกัดดูแลสุขภาพโดยรวม",        slugs: ["betaherb"] },
    { id: "nutrition", ico: "🥛", name: "เสริมโภชนาการ (ชงดื่ม)",  desc: "อาหารสูตรครบถ้วนชนิดผง ชงดื่มง่าย",        slugs: ["beta-life-balance", "lab-balance"] },
    { id: "skin",      ico: "✨", name: "ผิวพรรณ",                desc: "บำรุงผิวกายให้ชุ่มชื้น เนียนนุ่ม",         slugs: ["beta-care-cream"] }
  ];
  var bySlug = {};
  P.forEach(function (p) { bySlug[p.slug] = p; });

  /* กันตกหล่น: สินค้าที่ไม่อยู่ในกลุ่มไหนเลย ไปรวมกลุ่ม "อื่นๆ" */
  var grouped = {};
  GROUPS.forEach(function (g) { g.slugs.forEach(function (s) { grouped[s] = true; }); });
  var orphans = P.filter(function (p) { return !grouped[p.slug]; }).map(function (p) { return p.slug; });
  if (orphans.length) GROUPS.push({ id: "more", ico: "🧩", name: "ผลิตภัณฑ์อื่นๆ", desc: "สินค้าเสริมอื่นในร้าน", slugs: orphans });

  /* เรนเดอร์ chips + กลุ่ม (เฉพาะกลุ่มที่มีสินค้าจริง) */
  var chipsHtml = "", groupsHtml = "";
  GROUPS.forEach(function (g) {
    var items = g.slugs.map(function (s) { return bySlug[s]; }).filter(Boolean);
    if (!items.length) return;
    chipsHtml += '<a class="goal-chip" href="#g-' + g.id + '"><span class="goal-chip__ico">' + g.ico + "</span>" + A.esc(g.name) + "</a>";
    groupsHtml +=
      '<div class="goal-group" id="g-' + g.id + '">' +
        '<div class="goal-head">' +
          '<div class="goal-head__ico">' + g.ico + "</div>" +
          '<div class="goal-head__tx"><h2>' + A.esc(g.name) + "</h2><p>" + A.esc(g.desc) + "</p></div>" +
          '<div class="goal-count">' + items.length + " รายการ</div>" +
        "</div>" +
        '<div class="products-grid">' + items.map(A.productCard).join("") + "</div>" +
      "</div>";
  });
  A.$("#chips").innerHTML = chipsHtml;
  A.$("#groups").innerHTML = groupsHtml;

  var line = (S.site.contact && S.site.contact.lineUrl) ? S.site.contact.lineUrl : "#";
  A.$("#consult").setAttribute("href", line);

  A.bindAddButtons();
  A.initReveal();
});
</script>
</body>
</html>
